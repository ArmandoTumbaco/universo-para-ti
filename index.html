
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Un universo para ti</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Fondo de estrellas -->

    <canvas
        id="starsCanvas"
        aria-hidden="true"
    ></canvas>

    <!-- Música de fondo -->

    <audio
        id="backgroundMusic"
        src="assets/musica.mp3"
        preload="none"
        loop
    ></audio>

    <main class="experience">

        <!-- Encabezado -->

        <header class="header">

            <span class="header-title">
                UN UNIVERSO PARA TI
            </span>

            <span class="header-subtitle">
                UN LUGAR QUE SOLO EXISTE CONTIGO
            </span>

            <button
                id="musicButton"
                class="music-button"
                type="button"
                aria-label="Activar música"
                aria-pressed="false"
                title="Activar música"
            >
                ♪
            </button>

        </header>

        <!-- Escena principal -->

        <section
            id="scene"
            class="scene"
            aria-label="Historia"
        >

            <div class="scene-content">

                <p
                    id="sceneLabel"
                    class="scene-label"
                ></p>

                <h1
                    id="sceneTitle"
                    class="scene-title"
                ></h1>

                <p
                    id="sceneDescription"
                    class="scene-description"
                ></p>

                <!-- Mensajes de las flores -->

                <div
                    id="flowerMessage"
                    class="flower-message"
                    role="status"
                    aria-live="polite"
                ></div>

            </div>

            <!-- Área de animaciones -->

            <div class="scene-visual">

                <!-- Estrella principal -->

                <div
                    id="mainStar"
                    class="main-star"
                    aria-hidden="true"
                ></div>

                <!-- Corazón de estrellas -->

                <svg
                    id="constellation"
                    class="constellation"
                    viewBox="0 0 320 250"
                    aria-label="Corazón de estrellas con fotografía"
                >

                    <defs>

                        <!-- Recorte de la fotografía -->

                        <clipPath
                            id="heartClip"
                            clipPathUnits="userSpaceOnUse"
                        >

                            <path
                                d="
                                    M 160 212
                                    C 125 185, 56 132, 56 82
                                    C 56 25, 124 16, 160 65
                                    C 196 16, 264 25, 264 82
                                    C 264 132, 195 185, 160 212
                                    Z
                                "
                            />

                        </clipPath>

                        <!-- Brillo de las estrellas -->

                        <filter
                            id="starGlow"
                            x="-100%"
                            y="-100%"
                            width="300%"
                            height="300%"
                        >

                            <feGaussianBlur
                                stdDeviation="1.5"
                                result="blur"
                            />

                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>

                        </filter>

                        <!-- Sombra sobre la fotografía -->

                        <linearGradient
                            id="photoShade"
                            x1="0"
                            y1="0"
                            x2="0"
                            y2="1"
                        >

                            <stop
                                offset="0%"
                                stop-color="#101119"
                                stop-opacity="0.05"
                            />

                            <stop
                                offset="100%"
                                stop-color="#101119"
                                stop-opacity="0.25"
                            />

                        </linearGradient>

                    </defs>

                    <!-- Fotografía dentro del corazón -->

                    <g
                        class="heart-photo-group"
                        clip-path="url(#heartClip)"
                    >

                        <image
                            id="heartPhoto"
                            href="assets/foto-ella.jpeg"
                            x="48"
                            y="40"
                            width="220"
                            height="200"
                            preserveAspectRatio="xMidYMid slice"
                        ></image>

                        <rect
                            x="48"
                            y="20"
                            width="224"
                            height="200"
                            fill="url(#photoShade)"
                        ></rect>

                    </g>

                    <!-- Contorno cerrado del corazón -->

                    <path
                        id="heartPath"
                        d="
                            M 160 212
                            C 125 185, 56 132, 56 82
                            C 56 25, 124 16, 160 65
                            C 196 16, 264 25, 264 82
                            C 264 132, 195 185, 160 212
                            Z
                        "
                        fill="none"
                        stroke="#D9D9E8"
                        stroke-width="1.2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    ></path>

                    <!-- Estrellas de la constelación -->

                    <g
                        id="heartStars"
                        fill="#FFF4CC"
                        filter="url(#starGlow)"
                    ></g>

                </svg>

                <!-- Planeta con flores -->

                <div
                    id="planetSystem"
                    class="planet-system"
                >

                    <!-- Flores interactivas -->

                    <div
                        id="flowers"
                        class="flowers"
                    ></div>

                    <!-- Planeta -->

                    <div class="planet">

                        <div class="planet-light"></div>

                        <div class="planet-shadow"></div>

                    </div>

                    <div class="planet-glow"></div>

                </div>

            </div>

        </section>

        <!-- Navegación -->

        <nav
            class="navigation"
            aria-label="Navegación de la historia"
        >

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ← Atrás
            </button>

            <button
                id="nextButton"
                class="next-button"
                type="button"
            >
                Continuar
                <span>→</span>
            </button>

        </nav>

        <!-- Pie de página -->

        <footer class="footer">

            <span
                id="sceneCounter"
                class="scene-counter"
            >
                01 / 08
            </span>

            <span
                id="sceneFooter"
                class="scene-footer"
            >
                UN UNIVERSO PARA TI
            </span>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
